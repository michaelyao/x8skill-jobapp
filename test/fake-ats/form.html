<!doctype html>
<!--
  A fake ATS form that reproduces the shapes which have actually broken this system:

    • three work-experience blocks with IDENTICAL labels  (one approved answer used to be
      written into all three, giving every row the same employer)
    • a From/To date pair that validates ordering        ("Must end after start date")
    • a resume file input that COUNTS attachments        (the resume was attached every turn,
                                                          five times on one application)
    • a required "check one of the boxes below" group    (three untouched boxes used to be
                                                          reported as answered)
    • a required field with no approved answer           (the gate must refuse to advance)

  #grnhse_app makes the real GreenhouseDriver adopt this page, so the production reader,
  filler, replay agent and required-field gate all run against it unchanged.
-->
<html lang="en">
<head><meta charset="utf-8"><title>Fake ATS — Software Engineer Intern</title></head>
<body>
<div id="grnhse_app">
  <h1>Apply — Software Engineer Intern</h1>
  <form id="app" onsubmit="return handleSubmit(event)">

    <label for="name">Full name*</label>
    <input id="name" name="name" type="text" required>

    <label for="email">Email*</label>
    <input id="email" name="email" type="text" required>

    <div id="resume-area">
      <label for="resume">Resume*</label>
      <input id="resume" name="resume" type="file">
      <ul id="attachments"></ul>
    </div>

    <h2>Work experience</h2>
    <div id="experience"></div>

    <fieldset id="disability">
      <legend>Please check one of the boxes below:*</legend>
      <label><input type="checkbox" name="d1"> Yes, I have a disability, or have had one in the past</label>
      <label><input type="checkbox" name="d2"> No, I do not have a disability and have not had one in the past</label>
      <label><input type="checkbox" name="d3"> I do not want to answer</label>
    </fieldset>

    <label for="gpa">What is your current GPA?*</label>
    <input id="gpa" name="gpa" type="text" required>

    <div id="errors" role="alert" style="color:#c00"></div>
    <button type="submit" id="submit-btn">Submit Application</button>
  </form>
</div>

<script>
  // Three identical experience blocks — the point of the fixture.
  const BLOCKS = Number(new URLSearchParams(location.search).get("blocks") || 3);
  const months = ["", "Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const exp = document.getElementById("experience");
  for (let i = 0; i < BLOCKS; i++) {
    const wrap = document.createElement("fieldset");
    wrap.innerHTML = `
      <label for="title${i}">Job Title*</label><input id="title${i}" type="text" required>
      <label for="co${i}">Company*</label><input id="co${i}" type="text" required>
      <fieldset><legend>From*</legend>
        <label for="fm${i}">Month</label>
        <select id="fm${i}">${months.map(m => `<option>${m}</option>`).join("")}</select>
        <label for="fy${i}">Year</label><input id="fy${i}" type="text">
      </fieldset>
      <fieldset><legend>To*</legend>
        <label for="tm${i}">Month</label>
        <select id="tm${i}">${months.map(m => `<option>${m}</option>`).join("")}</select>
        <label for="ty${i}">Year</label><input id="ty${i}" type="text">
      </fieldset>`;
    exp.appendChild(wrap);
  }

  // Count attachments; each one appends a visible row, exactly like a real ATS.
  let uploads = 0;
  document.getElementById("resume").addEventListener("change", (e) => {
    if (!e.target.files.length) return;
    uploads += 1;
    const li = document.createElement("li");
    li.className = "uploaded";
    li.dataset.automationId = "file-upload-item";
    li.textContent = `${e.target.files[0].name} (attachment ${uploads})`;
    document.getElementById("attachments").appendChild(li);
    window.__uploads = uploads;
  });

  function dateOf(i, which) {
    const m = document.getElementById(`${which}m${i}`).value;
    const y = document.getElementById(`${which}y${i}`).value;
    if (!m || !y) return null;
    return Number(y) * 100 + months.indexOf(m);
  }

  function handleSubmit(event) {
    event.preventDefault();
    const errors = [];
    for (let i = 0; i < BLOCKS; i++) {
      const from = dateOf(i, "f"), to = dateOf(i, "t");
      if (from && to && to < from) errors.push("Error-To Must end after start date");
    }
    if (![...document.querySelectorAll("#disability input")].some((b) => b.checked)) {
      errors.push("Error: please check one of the boxes below");
    }
    document.getElementById("errors").textContent = errors.join(" | ");
    if (errors.length) return false;

    const rows = [];
    for (let i = 0; i < BLOCKS; i++) {
      rows.push({
        title: document.getElementById(`title${i}`).value,
        company: document.getElementById(`co${i}`).value,
        from: `${document.getElementById(`fm${i}`).value} ${document.getElementById(`fy${i}`).value}`.trim(),
        to: `${document.getElementById(`tm${i}`).value} ${document.getElementById(`ty${i}`).value}`.trim(),
      });
    }
    window.__submitted = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      gpa: document.getElementById("gpa").value,
      uploads,
      experience: rows,
    };
    fetch("/__submitted", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(window.__submitted) });
    document.body.insertAdjacentHTML("beforeend", "<p id='done'>Application submitted. Thanks for applying.</p>");
    return false;
  }
</script>
</body>
</html>
