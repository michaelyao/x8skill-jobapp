# The website only. The worker stays native on the host — see the header of Dockerfile.jobapp_website
# for why it cannot be containerized.
#
#   ./jobapp_website.sh up        # build if needed, then start
#   ./jobapp_website.sh status
#
# Listens on 8088. This is the ONLY website — the native LaunchDaemon copy that used to be
# installable on 8089 was removed 2026-08-24; recovery waits for a login by design, which was
# the only thing that copy bought.
#
# ONE service, and the 8-hour tick runs inside it (web/instrumentation.ts → src/scheduler.ts).
# It used to be a second `scheduler` service on this same image; that bought a second dist/
# entrypoint and a copy of the volume block below that had to be kept in sync by hand. The tick
# was never a cron job — it is a setInterval that writes a command file — so there was never a
# second process to supervise.
#
# Reboot safety: `restart: unless-stopped` brings this back when the Docker daemon comes
# back, but on macOS the daemon is Docker Desktop, which starts at GUI LOGIN. With no login,
# there is no daemon and therefore no container. Enable "Start Docker Desktop when you sign
# in" AND automatic login for this account, or the container is exactly as reboot-fragile as
# the launchd agent it replaced.

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile.jobapp_website
    image: x8skill-jobapp-website:latest
    container_name: jobapp_website
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:8088"
    environment:
      # Must match the mount point below: this is what makes src/config.ts resolve data/ to
      # the host's real state instead of an empty directory inside the image.
      JOBAPP_ROOT: /jobapp
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8088
      # The 8-hour tick, run in-process by web/instrumentation.ts. 8h paces how often we look
      # for new postings; the worker is what paces Chrome. SCHEDULE_EVERY_MS=0 disables it.
      SCHEDULE_EVERY_MS: "28800000"
      SCHEDULE_MAX_JOBS: "10"
    volumes:
      # Shared state. data/commands/ is how the website reaches the native worker: the
      # website writes a command file, the worker on the host picks it up within a tick.
      # Read-write, and it must be — this is the control channel, not a cache.
      - ./data:/jobapp/data
      - ./logs:/jobapp/logs
      # Accounts, session secret, API keys. The website only reads these.
      - ./.env:/jobapp/.env:ro
      - ./.x8note.config:/jobapp/.x8note.config:ro
      # Q&A.txt is the seed and is read-only. Q&A.md is REGENERATED by answerStore on load,
      # so mounting it :ro would make every answers page read throw.
      - ./Q&A.txt:/jobapp/Q&A.txt:ro
      - ./Q&A.md:/jobapp/Q&A.md
      - ./resumes.config:/jobapp/resumes.config:ro
      # playwright/ is deliberately absent. The website never drives a browser, so the
      # container has no reason to hold live session cookies.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8088/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
