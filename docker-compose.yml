# The console only. The worker stays native on the host — see the header of Dockerfile.jobapp_website
# for why it cannot be containerized.
#
#   ./jobapp_website.sh up        # build if needed, then start
#   ./jobapp_website.sh status
#
# Listens on 8090. The NATIVE console (web-start.sh, and the LaunchDaemon that
# install-services.sh sets up) keeps 8088, so the two can run side by side on the same data/.
#
# Reboot safety: `restart: unless-stopped` brings this back when the Docker daemon comes
# back, but on macOS the daemon is Docker Desktop, which starts at GUI LOGIN. With no login,
# there is no daemon and therefore no container. Enable "Start Docker Desktop when you sign
# in" AND automatic login for this account, or the container is exactly as reboot-fragile as
# the launchd agent it replaced.

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile.jobapp_website
    image: x8skill-jobapp-website:latest
    container_name: jobapp_website
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:8090"
    environment:
      # Must match the mount point below: this is what makes src/config.ts resolve data/ to
      # the host's real state instead of an empty directory inside the image.
      JOBAPP_ROOT: /jobapp
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8090
    volumes:
      # Shared state. data/commands/ is how the console reaches the native worker: the
      # console writes a command file, the worker on the host picks it up within a tick.
      # Read-write, and it must be — this is the control channel, not a cache.
      - ./data:/jobapp/data
      - ./logs:/jobapp/logs
      # Accounts, session secret, API keys. The console only reads these.
      - ./.env:/jobapp/.env:ro
      - ./.x8note.config:/jobapp/.x8note.config:ro
      # Q&A.txt is the seed and is read-only. Q&A.md is REGENERATED by answerStore on load,
      # so mounting it :ro would make every answers page read throw.
      - ./Q&A.txt:/jobapp/Q&A.txt:ro
      - ./Q&A.md:/jobapp/Q&A.md
      - ./resumes.config:/jobapp/resumes.config:ro
      # playwright/ is deliberately absent. The console never drives a browser, so the
      # container has no reason to hold live session cookies.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # The 8-hour tick: rebuild the job list, queue the next batch. No browser — it only writes a
  # command file, which the worker on the host executes. Its own service rather than cron inside
  # the web container: the image has no cron, and adding one would mean supervising two processes
  # in a container built to run one.
  scheduler:
    image: x8skill-jobapp-website:latest
    container_name: jobapp_scheduler
    depends_on: [website]
    restart: unless-stopped
    # Absolute path and an explicit working_dir: the image's WORKDIR is /app/web (that is where
    # `next start` must run from), so a relative "dist/scheduler.js" resolves to
    # /app/web/dist/ and dies with MODULE_NOT_FOUND.
    working_dir: /app
    command: ["node", "/app/dist/scheduler.js"]
    environment:
      JOBAPP_ROOT: /jobapp
      # 8h. The worker is what paces Chrome; this only decides how often we look for new postings.
      SCHEDULE_EVERY_MS: "28800000"
      SCHEDULE_MAX_JOBS: "10"
    volumes:
      # Shared state. data/commands/ is how the console reaches the native worker: the
      # console writes a command file, the worker on the host picks it up within a tick.
      # Read-write, and it must be — this is the control channel, not a cache.
      - ./data:/jobapp/data
      - ./logs:/jobapp/logs
      # Accounts, session secret, API keys. The console only reads these.
      - ./.env:/jobapp/.env:ro
      - ./.x8note.config:/jobapp/.x8note.config:ro
      # Q&A.txt is the seed and is read-only. Q&A.md is REGENERATED by answerStore on load,
      # so mounting it :ro would make every answers page read throw.
      - ./Q&A.txt:/jobapp/Q&A.txt:ro
      - ./Q&A.md:/jobapp/Q&A.md
      - ./resumes.config:/jobapp/resumes.config:ro
      # playwright/ is deliberately absent. The console never drives a browser, so the
      # container has no reason to hold live session cookies.
